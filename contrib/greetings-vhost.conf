# Apache virtual host for greetings.
#
# Drop into /etc/httpd/conf.d/ on an httpd that is already running other
# sites; it adds a vhost and touches nothing global. The TLS vhost is guarded
# by <IfFile>, so this file is valid before certbot has run and switches TLS
# on at the first reload after it.
#
# Replace greetings.example.org everywhere, including the certificate paths
# (in vi: `:%s/greetings.example.org/your.host.name/g`), then:
#
#     sudo mkdir -p /var/www/greetings-acme
#     sudo cp contrib/greetings-vhost.conf /etc/httpd/conf.d/greetings.conf
#     sudo apachectl configtest && sudo systemctl reload httpd
#     sudo certbot certonly --webroot -w /var/www/greetings-acme -d greetings.example.org
#     sudo systemctl reload httpd

<VirtualHost *:80>
    ServerName greetings.example.org

    # The ACME challenge, for the first certificate and every renewal.
    DocumentRoot /var/www/greetings-acme

    # Everything else goes to TLS, once there is a certificate to go to.
    # The QR code says https://, so guests only come here if they type it.
    <IfFile /etc/letsencrypt/live/greetings.example.org/fullchain.pem>
        RedirectMatch permanent "^/(?!\.well-known/)(.*)" \
            "https://greetings.example.org/$1"
    </IfFile>
</VirtualHost>


<IfFile /etc/letsencrypt/live/greetings.example.org/fullchain.pem>
<VirtualHost *:443>
    ServerName greetings.example.org

    <IfModule mod_http2.c>
        Protocols h2 http/1.1
    </IfModule>

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/greetings.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/greetings.example.org/privkey.pem
    <IfFile /etc/letsencrypt/options-ssl-apache.conf>
        Include /etc/letsencrypt/options-ssl-apache.conf
    </IfFile>

    ErrorLog  /var/log/httpd/greetings_error.log
    CustomLog /var/log/httpd/greetings_access.log combined

    # With `behind_proxy = true` in config.toml, the application believes
    # these: the guest's real address (for the flood limit) and https.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:8098/ retry=0
    ProxyPassReverse / http://127.0.0.1:8098/

    <IfModule mod_filter.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    </IfModule>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
    </IfModule>
</VirtualHost>
</IfFile>
